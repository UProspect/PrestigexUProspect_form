<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prestige Recruit × UProspect</title>
<meta name="description" content="Propuesta de integración entre Prestige Recruit y UProspect.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#981C1F; --red-dark:#6E1416; --red-light:#C2393C; --rose:#F6E7E7;
    --dark:#232321; --gray:#E7E7E3; --white:#FFFFFF; --bg:#F7F7F4; --muted:#5E5E5A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Rubik',system-ui,sans-serif;background:var(--bg);color:var(--dark);line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased}
  .top{background:var(--white);border-bottom:1px solid var(--gray);padding:16px 20px}
  .top-inner{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px}
  .top .u{color:var(--red);font-size:1.15rem}
  .top .x{color:var(--muted);font-weight:500}
  .top .p{font-size:1.15rem}
  main{max-width:720px;margin:0 auto;padding:32px 16px 64px}
  .card{background:var(--white);border:1px solid var(--gray);border-radius:16px;padding:28px 24px}
  @media(min-width:640px){.card{padding:36px 40px}}
  .eyebrow{font-size:.78rem;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--red)}
  h1{font-size:1.9rem;line-height:1.2;font-weight:800;margin:8px 0 14px}
  h2{font-size:1.45rem;line-height:1.25;font-weight:700;margin:8px 0 10px}
  h3{font-size:1.05rem;font-weight:700}
  p{color:#3a3a37}
  .lead{font-size:1.05rem}
  .base{background:var(--rose);border-radius:12px;padding:18px 20px;margin:22px 0}
  .base h3{color:var(--red-dark);margin-bottom:8px}
  .base ul{padding-left:20px}
  .base li{margin:6px 0;color:#3a3a37}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;font-size:1rem;font-weight:600;border:0;border-radius:999px;padding:14px 28px;cursor:pointer;transition:background .15s, transform .1s}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--red);color:var(--white)}
  .btn-primary:hover{background:var(--red-dark)}
  .btn-primary:disabled{background:#c9b3b3;cursor:not-allowed}
  .btn-ghost{background:transparent;color:var(--muted);padding:14px 10px}
  .btn-ghost:hover{color:var(--dark)}
  .row{display:flex;justify-content:space-between;align-items:center;margin-top:26px;gap:12px;flex-wrap:wrap}
  .note{font-size:.85rem;color:var(--muted)}
  .progress{height:6px;background:var(--gray);border-radius:99px;overflow:hidden;margin:6px 0 24px}
  .progress span{display:block;height:100%;background:var(--red);border-radius:99px;transition:width .3s}
  .step-meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);font-weight:500}
  .opts{display:grid;gap:12px;margin-top:20px}
  .opt{display:block;width:100%;text-align:left;font-family:inherit;font-size:1rem;color:var(--dark);background:var(--white);border:1.5px solid var(--gray);border-radius:12px;padding:16px 18px;cursor:pointer;transition:border-color .15s,background .15s}
  .opt:hover{border-color:var(--red-light)}
  .opt.sel{border-color:var(--red);background:var(--rose)}
  .rec{display:inline-block;background:var(--red);color:var(--white);font-size:.75rem;font-weight:600;letter-spacing:.8px;text-transform:uppercase;border-radius:99px;padding:5px 12px;margin-bottom:10px}
  .tabs{display:flex;gap:8px;margin:22px 0 16px;flex-wrap:wrap}
  .tab{font-family:inherit;font-size:.92rem;font-weight:600;border:1.5px solid var(--gray);background:var(--white);color:var(--muted);border-radius:99px;padding:9px 16px;cursor:pointer}
  .tab.on{border-color:var(--dark);background:var(--dark);color:var(--white)}
  .option-box{border:1.5px solid var(--gray);border-radius:14px;padding:22px 20px}
  .option-box .tagline{color:var(--muted);margin:4px 0 18px}
  .phase{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--gray)}
  .phase:first-of-type{border-top:0;padding-top:0}
  .badge{background:var(--rose);color:var(--red-dark);font-weight:700;font-size:.78rem;border-radius:8px;padding:6px 10px;height:fit-content;white-space:nowrap}
  .phase .dur{font-size:.82rem;color:var(--muted);font-weight:500}
  .phase p{margin-top:4px;font-size:.95rem}
  .choose{margin-top:26px}
  .choose h3{margin-bottom:4px}
  label.f{display:block;font-weight:600;font-size:.92rem;margin:18px 0 6px}
  input,textarea{width:100%;font-family:inherit;font-size:1rem;color:var(--dark);border:1.5px solid var(--gray);border-radius:10px;padding:12px 14px;background:var(--white)}
  input:focus,textarea:focus,.opt:focus-visible,.btn:focus-visible,.tab:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-color:var(--red)}
  textarea{min-height:110px;resize:vertical}
  .err{color:var(--red);font-size:.9rem;margin-top:14px}
  .check{width:56px;height:56px;border-radius:50%;background:var(--rose);color:var(--red);display:grid;place-items:center;font-size:1.6rem;font-weight:700;margin-bottom:16px}
  .summary{background:var(--bg);border:1px solid var(--gray);border-radius:12px;padding:14px 18px;margin-top:18px}
  .summary summary{cursor:pointer;font-weight:600;color:var(--red)}
  .summary ol{padding-left:20px;margin-top:12px}
  .summary li{margin:10px 0;font-size:.92rem}
  .summary li span{display:block;color:var(--muted)}
  .qtext{margin-top:14px}
  footer{text-align:center;font-size:.8rem;color:var(--muted);padding:0 16px 32px}
</style>
</head>
<body>
<header class="top"><div class="top-inner"><span class="p">Prestige Recruit</span><span class="x">×</span><span class="u">UProspect</span></div></header>
<main id="app"></main>
<footer>UProspect · Unlock your Potential</footer>

<script>
/* ===== CONFIGURACIÓN =====
   Escribe aquí el correo donde quieres recibir las respuestas.
   La primera vez que alguien envíe el formulario, FormSubmit te mandará
   un correo de activación a esa dirección: confírmalo y listo. */
const FORM_EMAIL = "admin@uprospectpr.com";

const PILOT = {tag:"Fase 1", dur:"3 meses", t:"Piloto de colaboración",
  d:"Integramos tus atletas y universidades a UProspect y medimos juntos los resultados: atletas migrados, universidades activas y nuevos clubes."};

const OPTIONS = {
  o1:{num:"Opción 1", name:"Socio inversionista",
    tagline:"Participa en el crecimiento de UProspect sin estar en la operación diaria.",
    phases:[PILOT,
      {tag:"Fase 2", dur:"Al cerrar el piloto", t:"Inversión por participación",
       d:"Aportas capital a cambio de un porcentaje de UProspect. El capital se destina a un objetivo definido, como el desarrollo de la app móvil. Tu rol es de inversionista, sin obligación en la operación diaria."}]},
  o2:{num:"Opción 2", name:"Director de Operaciones Deportivas",
    tagline:"Lidera competencias y showcases, con la posibilidad de crecer junto a UProspect.",
    phases:[PILOT,
      {tag:"Fase 2", dur:"6 a 12 meses", t:"Director de Operaciones Deportivas",
       d:"Asumes la dirección de torneos y del UProspect Showcase, con el respaldo de la plataforma, la base de atletas y las estadísticas de UProStats. Recibes un porcentaje de las ganancias de los eventos que produzcas, a definir en conjunto."},
      {tag:"Fase 3", dur:"A evaluar", t:"Participación a largo plazo",
       d:"Según cómo evolucione la colaboración, podríamos evaluar juntos la posibilidad de una participación en UProspect. Cualquier acuerdo de este tipo, y sus condiciones, se definiría más adelante con asesoría legal."}]}
};

const QUESTIONS = [
  {q:"¿Cuánto tiempo te gustaría dedicarle a UProspect?", opts:[
    {t:"Poco o ninguno; prefiero no estar en la operación", s:{o1:2}},
    {t:"Algunas horas al mes, en proyectos puntuales", s:{o1:1,o2:1}},
    {t:"Me gustaría involucrarme activamente", s:{o2:2}}]},
  {q:"¿Qué te motiva más de esta integración?", opts:[
    {t:"Ver crecer la plataforma y mi inversión", s:{o1:2}},
    {t:"Organizar torneos, showcases y eventos", s:{o2:2}},
    {t:"Conectar atletas con universidades y clubes", s:{o2:1}}]},
  {q:"¿Estarías dispuesto a aportar capital a UProspect?", opts:[
    {t:"Sí, si el piloto da buenos resultados", s:{o1:2}},
    {t:"Más adelante, después de ver resultados de mi trabajo", s:{o2:1}},
    {t:"Por ahora prefiero no aportar capital", s:{o2:2}}]},
  {q:"Si en el futuro llegaras a tener participación en UProspect, ¿qué camino te parece más natural?", opts:[
    {t:"A través de una inversión de capital", s:{o1:2}},
    {t:"Construyéndola con el tiempo a través de la colaboración", s:{o2:2}},
    {t:"Una combinación de ambas", s:{o1:1,o2:1}}]},
  {q:"¿Qué rol te ves teniendo dentro de UProspect?", opts:[
    {t:"Inversionista y asesor estratégico", s:{o1:2}},
    {t:"Director a cargo de competencias y eventos", s:{o2:2}},
    {t:"Todavía no lo tengo claro", s:{}}]},
  {q:"¿Qué es lo más valioso que podrías aportar a UProspect?", opts:[
    {t:"Capital y visión de negocio", s:{o1:2}},
    {t:"Experiencia organizando torneos y eventos", s:{o2:2}},
    {t:"Mi red de clubes, escuelas y universidades", s:{o2:1}},
    {t:"Conocimiento en desarrollo de plataformas", s:{o1:1}}]},
  {q:"¿Qué esperas recibir a cambio de integrar Prestige Recruit a UProspect?", opts:[
    {t:"Nada inmediato; me interesa el proyecto a largo plazo", s:{}},
    {t:"Una compensación económica por la plataforma", s:{}},
    {t:"Ingresos por el trabajo que realice", s:{o2:1}},
    {t:"Una participación en la empresa", s:{o1:1}}]},
  {q:"¿Cómo te gustaría manejar la transición de los atletas de Prestige Recruit?", opts:[
    {t:"Prefiero que UProspect se encargue de la comunicación", s:{o1:1}},
    {t:"Quiero comunicarme yo directamente con ellos", s:{o2:1}},
    {t:"Lo trabajamos juntos", s:{}}]},
  {q:"¿Qué planes tienes para Prestige Sports en los próximos años?", textOn:3, ph:"Cuéntanos tus planes…", opts:[
    {t:"Seguir enfocado en la gestión de clubes y torneos", s:{}},
    {t:"Desarrollar nuevas plataformas o productos tecnológicos", s:{}},
    {t:"Reducir mi carga y enfocarme en menos proyectos", s:{}},
    {t:"Otro (cuéntanos)", s:{}}]},
  {q:"¿Planeas seguir desarrollando otras plataformas o proyectos de reclutamiento?", opts:[
    {t:"No, quiero enfocar ese esfuerzo en UProspect", s:{}},
    {t:"Sí, pero en áreas que no compiten con UProspect", s:{}},
    {t:"Sí, tengo otros proyectos en desarrollo", s:{}},
    {t:"Todavía no lo sé", s:{}}]},
  {q:"¿Cuándo te gustaría comenzar el piloto?", opts:[
    {t:"Este mismo mes", s:{}},
    {t:"En los próximos 2 a 3 meses", s:{}},
    {t:"Antes de la próxima temporada", s:{}},
    {t:"Prefiero conversarlo primero", s:{}}]},
  {q:"¿Hay algo de esta integración que te preocupe o te genere dudas?", textOn:1, ph:"Escribe aquí lo que quieras comentar…", opts:[
    {t:"No, por ahora no", s:{}},
    {t:"Sí, quiero comentarlo", s:{}}]}
];

const state = {step:-1, answers:Array(QUESTIONS.length).fill(null), texts:Array(QUESTIONS.length).fill(""), view:null, choice:null};
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function needsText(i){ const Q=QUESTIONS[i]; return Q.textOn!==undefined && state.answers[i]===Q.textOn; }
function canNext(i){ if(state.answers[i]===null) return false; return !needsText(i) || state.texts[i].trim().length>0; }
function answerText(i){ const a=QUESTIONS[i].opts[state.answers[i]].t; return needsText(i) ? `${a}: ${state.texts[i].trim()}` : a; }
const app = document.getElementById("app");

function scores(){
  const s={o1:0,o2:0};
  state.answers.forEach((a,i)=>{ if(a===null) return; const sc=QUESTIONS[i].opts[a].s; s.o1+=sc.o1||0; s.o2+=sc.o2||0; });
  return s;
}
function recommended(){ const s=scores(); return s.o1>s.o2 ? "o1" : "o2"; }
function scrollToTop(){ window.scrollTo({top:0,behavior:"smooth"}); }

function renderIntro(){
  app.innerHTML = `
  <section class="card">
    <div class="eyebrow">Propuesta de integración</div>
    <h1>Hola, Jeselky</h1>
    <p class="lead">Preparamos dos caminos para integrar Prestige Recruit a UProspect. Contesta unas preguntas rápidas y te recomendaremos la opción que mejor encaja contigo. Al final podrás escoger y enviarnos tu respuesta.</p>
    <div class="base">
      <h3>Ambas opciones comienzan con un piloto de 3 meses</h3>
      <ul>
        <li>Tus atletas y universidades se integran a UProspect.</li>
        <li>Coordinamos juntos cómo migrar a los atletas que ya tienen perfil en Prestige Recruit.</li>
        <li>Durante un periodo de transición, Prestige Recruit redirige a sus atletas a UProspect. Luego la plataforma se deshabilita, así no tienes que seguir manteniéndola.</li>
        <li>Medimos juntos los resultados para decidir el próximo paso.</li>
      </ul>
    </div>
    <div class="row">
      <span class="note">${QUESTIONS.length} preguntas · unos 4 minutos</span>
      <button class="btn btn-primary" id="start">Comenzar</button>
    </div>
  </section>`;
  document.getElementById("start").onclick=()=>{state.step=0;render();};
}

function renderQuestion(){
  const i=state.step, Q=QUESTIONS[i], n=QUESTIONS.length;
  app.innerHTML = `
  <section class="card">
    <div class="step-meta"><span>Pregunta ${i+1} de ${n}</span><span>${Math.round((i)/n*100)}%</span></div>
    <div class="progress"><span style="width:${(i)/n*100}%"></span></div>
    <h2>${Q.q}</h2>
    <div class="opts">
      ${Q.opts.map((o,k)=>`<button class="opt ${state.answers[i]===k?'sel':''}" data-k="${k}">${o.t}</button>`).join("")}
    </div>
    ${Q.textOn!==undefined?`<textarea id="qtext" class="qtext" aria-label="Tu respuesta" placeholder="${Q.ph||'Escribe aquí…'}" style="display:${needsText(i)?'block':'none'}">${esc(state.texts[i])}</textarea>`:''}
    <div class="row">
      <button class="btn btn-ghost" id="back">← Atrás</button>
      <button class="btn btn-primary" id="next" ${canNext(i)?'':'disabled'}>${i===n-1?'Ver mi recomendación':'Siguiente'}</button>
    </div>
  </section>`;
  const ta=document.getElementById("qtext");
  const refresh=()=>{document.getElementById("next").disabled=!canNext(i);};
  if(ta) ta.oninput=()=>{state.texts[i]=ta.value;refresh();};
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    state.answers[i]=+b.dataset.k;
    app.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel",x===b));
    if(ta){ ta.style.display=needsText(i)?'block':'none'; if(needsText(i)) ta.focus(); }
    refresh();
  });
  document.getElementById("back").onclick=()=>{state.step--;render();};
  document.getElementById("next").onclick=()=>{
    if(i===n-1){state.step="result";state.view=recommended();}
    else state.step++;
    render();
  };
}

function optionBox(key){
  const o=OPTIONS[key];
  return `<div class="option-box">
    ${key===recommended()?'<span class="rec">Recomendada para ti</span>':''}
    <div class="eyebrow">${o.num}</div>
    <h2>${o.name}</h2>
    <p class="tagline">${o.tagline}</p>
    ${o.phases.map(p=>`<div class="phase"><span class="badge">${p.tag}</span><div><h3>${p.t}</h3><div class="dur">${p.dur}</div><p>${p.d}</p></div></div>`).join("")}
  </div>`;
}

function renderResult(){
  const rec=recommended();
  const choices=[["o1","Opción 1: Socio inversionista"],["o2","Opción 2: Director de Operaciones Deportivas"],["talk","Prefiero conversarlo antes de decidir"]];
  app.innerHTML = `
  <section class="card">
    <div class="eyebrow">Tu recomendación</div>
    <h1>${OPTIONS[rec].num}: ${OPTIONS[rec].name}</h1>
    <p class="lead">Según tus respuestas, esta opción es la que mejor encaja con tu disponibilidad y tus intereses. Puedes revisar ambas antes de escoger.</p>
    <div class="tabs">
      <button class="tab ${state.view==='o1'?'on':''}" data-v="o1">Opción 1</button>
      <button class="tab ${state.view==='o2'?'on':''}" data-v="o2">Opción 2</button>
    </div>
    ${optionBox(state.view)}
    <div class="choose">
      <h3>¿Con cuál opción te gustaría avanzar?</h3>
      <div class="opts">
        ${choices.map(([k,t])=>`<button class="opt ${state.choice===k?'sel':''}" data-c="${k}">${t}</button>`).join("")}
      </div>
    </div>
    <div class="row">
      <button class="btn btn-ghost" id="back">← Revisar respuestas</button>
      <button class="btn btn-primary" id="next" ${state.choice?'':'disabled'}>Continuar</button>
    </div>
  </section>`;
  app.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{state.view=t.dataset.v;renderResult();});
  app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{
    state.choice=b.dataset.c;
    app.querySelectorAll("[data-c]").forEach(x=>x.classList.toggle("sel",x===b));
    document.getElementById("next").disabled=false;
  });
  document.getElementById("back").onclick=()=>{state.step=QUESTIONS.length-1;render();};
  document.getElementById("next").onclick=()=>{state.step="contact";render();};
}

function renderContact(){
  app.innerHTML = `
  <section class="card">
    <div class="eyebrow">Último paso</div>
    <h2>Envíanos tu respuesta</h2>
    <p>Con esto preparamos la propuesta formal y coordinamos una reunión.</p>
    <details class="summary">
      <summary>Revisar mis respuestas</summary>
      <ol>
        ${QUESTIONS.map((q,i)=>`<li><span>${q.q}</span><strong>${esc(answerText(i))}</strong></li>`).join("")}
      </ol>
    </details>
    <form id="f" novalidate>
      <label class="f" for="name">Nombre</label>
      <input id="name" autocomplete="name" required>
      <label class="f" for="email">Correo electrónico</label>
      <input id="email" type="email" autocomplete="email" required>
      <label class="f" for="phone">Teléfono (opcional)</label>
      <input id="phone" type="tel" autocomplete="tel">
      <label class="f" for="comments">¿Algo que quieras añadir o ajustar? (opcional)</label>
      <textarea id="comments"></textarea>
      <div id="err" class="err" role="alert"></div>
      <div class="row">
        <button type="button" class="btn btn-ghost" id="back">← Atrás</button>
        <button type="submit" class="btn btn-primary" id="send">Enviar mi respuesta</button>
      </div>
    </form>
  </section>`;
  document.getElementById("back").onclick=()=>{state.step="result";render();};
  document.getElementById("f").onsubmit=submit;
}

async function submit(e){
  e.preventDefault();
  const v=id=>document.getElementById(id).value.trim();
  const err=document.getElementById("err");
  if(!v("name")||!/^\S+@\S+\.\S+$/.test(v("email"))){err.textContent="Escribe tu nombre y un correo válido.";return;}
  const s=scores(), rec=recommended();
  const choiceLabel={o1:"Opción 1: Socio inversionista",o2:"Opción 2: Director de Operaciones Deportivas",talk:"Prefiere conversarlo antes de decidir"}[state.choice];
  const payload={
    _subject:"Respuesta: Prestige Recruit × UProspect",
    _template:"table",
    _captcha:"false",
    "Nombre":v("name"),
    email:v("email"),
    "Teléfono":v("phone")||"—",
    "Opción recomendada":`${OPTIONS[rec].num}: ${OPTIONS[rec].name}`,
    "Opción escogida":choiceLabel,
    "Puntuación (Opción 1 / Opción 2)":`${s.o1} / ${s.o2}`
  };
  QUESTIONS.forEach((q,i)=>{payload[`P${String(i+1).padStart(2,"0")}. ${q.q}`]=answerText(i);});
  payload["Comentarios"]=v("comments")||"—";

  const btn=document.getElementById("send");
  btn.disabled=true; btn.textContent="Enviando…"; err.textContent="";
  try{
    const r=await fetch(`https://formsubmit.co/ajax/${FORM_EMAIL}`,{
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      body:JSON.stringify(payload)
    });
    if(!r.ok) throw new Error(r.status);
    state.step="done"; render();
  }catch(_){
    err.textContent="No se pudo enviar tu respuesta. Intenta de nuevo en unos minutos.";
    btn.disabled=false; btn.textContent="Enviar mi respuesta";
  }
}

function renderDone(){
  app.innerHTML = `
  <section class="card">
    <div class="check">✓</div>
    <h1>¡Gracias, ${document.getElementById("name")?.value || ""}!</h1>
    <p class="lead">Recibimos tu respuesta. Te contactaremos pronto para conversar los próximos pasos.</p>
  </section>`;
}

function render(){
  const s=state.step;
  if(s===-1) renderIntro();
  else if(typeof s==="number") renderQuestion();
  else if(s==="result") renderResult();
  else if(s==="contact") renderContact();
  else if(s==="done") renderDone();
  scrollToTop();
}
render();
</script>
</body>
</html>
